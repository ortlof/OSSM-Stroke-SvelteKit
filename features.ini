; Feature selection for the OSSM build. 1 = compiled in, 0 = left out.
; Each disabled feature saves flash and a couple of HTTP endpoints.
[features]
build_flags = 
  -D FT_SECURITY=1             ; keep: the stroke control API must be authenticated
  -D FT_MQTT=0                 ; not used: the Windows HUD and the browser both speak REST
  -D FT_NTP=0                  ; only needed for TLS, and TLS was only for MQTT
  -D FT_UPLOAD_FIRMWARE=1      ; update the firmware from the browser
  -D FT_DOWNLOAD_FIRMWARE=0    ; saves the SSL cert bundle; enable when you have a release server
  -D FT_SLEEP=0                ; OSSM is mains powered, no deep sleep
  -D FT_BATTERY=0
  -D FT_ANALYTICS=0            ; no analytics charts in the UI, saves flash
  -D FT_COREDUMP=0
;  -D FT_ETHERNET=1            ; only for boards with a W5500/LAN8720 PHY
