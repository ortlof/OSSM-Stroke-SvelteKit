; ============================================================================
;  OSSM-Stroke on ESP32-SvelteKit  --  merged PlatformIO project
;  Motion: theelims/orlof StrokeEngine (millimetre, linear-speed variant)
;  Network + control backend: theelims/ESP32-sveltekit (REST + WebSocket + MQTT)
; ============================================================================

[platformio]
description = OSSM Stroke controller on ESP32-SvelteKit
data_dir = data
extra_configs =
	factory_settings.ini
	features.ini
default_envs = esp32dev

[env]
framework = arduino
; pioarduino fork: Arduino core 3.x / ESP-IDF 5.5. Required for ESP32-SvelteKit.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
build_flags =
	${factory_settings.build_flags}
	${features.build_flags}
	-D BUILD_TARGET=\"$PIOENV\"
	-D APP_NAME=\"OSSM-Stroke\"          ; only [a-zA-Z0-9-_], it becomes a filename
	-D APP_VERSION=\"0.7.6\"             ; semver, used by the OTA name scheme

	; Networking on core 0, motion and application logic stay on core 1
	-D ESP32SVELTEKIT_RUNNING_CORE=0

	; Front end goes into the firmware binary (single-file OTA). Comment out to
	; serve the UI from the LittleFS partition instead.
	-D EMBED_WWW

	; Never let a browser keep the embedded front end forever. The asset names
	; carry no content hash, so with the default one year immutable cache an OTA
	; that changes the UI stays invisible until the user clears the cache.
	; Drop this flag when the UI is frozen for a release.
	-D WWW_NO_CACHE

	-D SERIAL_INFO
	-D CORE_DEBUG_LEVEL=3

	; --- OSSM mechanics (see src/OSSM_Config.h for the annotated original) ---
	-D OSSM_STEP_PER_MM=84.88
	-D OSSM_MAX_SPEED_MM_S=300.0
	-D OSSM_MAX_ACCEL_MM_S2=10000.0
	-D OSSM_PHYSICAL_TRAVEL_MM=450.0
	-D OSSM_KEEPOUT_MM=15.0
	-D OSSM_USER_SPEEDLIMIT_MM_S=300.0

lib_compat_mode = strict
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	log2file
board_build.filesystem = littlefs

; FT_MQTT=1 and FT_DOWNLOAD_FIRMWARE=1 both need this embedded certificate
; bundle. Leave these three lines in place whenever MQTT is enabled, otherwise
; the link step fails with an undefined reference to
; _binary_src_certs_x509_crt_bundle_bin_start.
board_build.embed_files = src/certs/x509_crt_bundle.bin
board_ssl_cert_source = adafruit

extra_scripts =
	pre:scripts/build_interface.py
	pre:scripts/generate_cert_bundle.py
	scripts/merge_bin.py
	scripts/rename_fw.py
	scripts/save_elf.py
lib_deps =
	ArduinoJson@>=7.0.0
	elims/PsychicMqttClient@^0.2.4
	gin66/FastAccelStepper@^2.0.1

; ---------------------------------------------------------------------------
; OSSM reference board: ESP32-WROOM-32E, 4 MB flash.
; min_spiffs.csv gives two 1.875 MB app slots and a small LittleFS. With
; EMBED_WWW the front end costs 247,897 bytes (measured), so check the size
; with `pio run -t size` after every feature addition.
; ---------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
	${env.build_flags}
	-D LED_BUILTIN=2
	-D KEY_BUILTIN=0
	; classic ESP32 has PSRAM only on -WROVER modules; no USB CDC
	-D ARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------------
; Recommended target for the refactor: ESP32-S3 module with 8 MB flash/PSRAM.
; More flash for the front end and a second core for motion.
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

; ---------------------------------------------------------------------------
; OTA over the network
;
; There is no espota / ArduinoOTA in this firmware, so `upload_protocol = espota`
; and `pio run -t upload --upload-port <ip>` do NOT work. With FT_UPLOAD_FIRMWARE=1
; the device does the update itself:
;
;     POST /rest/uploadFirmware   multipart, field "file", JWT required
;
; Progress arrives on the WebSocket event "otastatus". Use the helper:
;
;     scripts/ota-upload.py --device <ip> build/release/<image>.bin
;
; The image must fit the next OTA partition; UploadFirmwareService rejects a
; larger file. See build/release/ for the images produced by this build.
; ---------------------------------------------------------------------------
